name: Retrieve Seldra Narration
on:
  push:
    paths: ['.github/workflows/retrieve-seldra-narration.yml']
    branches: [film/seldra-actual-interface]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  narration:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch generated narration (no keys)
        run: |
          curl --location --fail --silent --show-error --max-time 45 \
            -o seldra-narration.mp3 \
            'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/2feb3cf9-7440-4161-b70d-43c15b6a7707.mp3'
          file seldra-narration.mp3
          test "$(file -b seldra-narration.mp3)" != 'HTML document'
          test $(stat -c%s seldra-narration.mp3) -gt 20000
      - name: Export narration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seldra-premium-voiceover
          path: seldra-narration.mp3
          if-no-files-found: ignore
