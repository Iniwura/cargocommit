name: Capture Seldra Film Footage
on:
  push:
    branches: [film/seldra-actual-interface]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser and dependencies
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build actual production application
        run: npm run build
      - name: Record production UI journey
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/seldra-film-server.log 2>&1 &
          sleep 4
          node scripts/capture-seldra-film.mjs
      - name: Save scene capture and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seldra-actual-interface-film-raw
          path: frontend/film-raw/
          compression-level: 0
          if-no-files-found: warn
