name: Seldra Order UI Browser QA

on:
  push:
    branches: [fix/seldra-order-detail-navigation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install app and browser smoke dependencies
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test desktop wallet listing and mobile direct order link
        env:
          SELDRA_SMOKE_URL: https://cargocommit-git-fix-seldra-order-df1dcb-iniwura-akurus-projects.vercel.app
        run: node scripts/smoke-order-navigation.mjs
      - name: Archive browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seldra-browser-smoke
          path: frontend/smoke-artifacts/
          if-no-files-found: ignore
