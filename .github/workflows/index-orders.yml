name: Update Seldra order index

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  # One-shot smoke run when the indexer workflow itself changes.
  push:
    branches: [master]
    paths:
      - '.github/workflows/index-orders.yml'

permissions:
  contents: write

concurrency:
  group: seldra-order-index
  cancel-in-progress: false

jobs:
  index-orders:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Index factory OrderCreated events
        run: node frontend/scripts/update-order-index.mjs
      - name: Publish index only when it changed
        run: |
          git add frontend/public/seldra-order-index.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: update Seldra factory order index"
            git push origin HEAD:master
          else
            echo "Order index unchanged"
          fi
